name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Registry generation gates, plus the packaging smoke check — `dist` must
      # stay loadable by Node's ESM resolver. Builds dist itself; a bundler-only
      # matrix never catches this.
      - run: bun run test
